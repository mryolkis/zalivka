[package]
name = "zalivka"
version = "0.2.6"
edition = "2024"
rust-version = "1.99"
description = "Experimental native Rust DFU restore client for Apple Silicon and T2 Macs"
license = "MIT AND Apache-2.0"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:winresource"]

[dependencies]
anyhow = "1"
aes = "0.9"
ctr = "0.10"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lzfse_rust = "0.2"
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-decode"] }
zbitmap = "0.1"
asn1-rs = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5"
base16ct = { version = "1", features = ["alloc"] }
oxiri = "0.3"
nusb = "0.2.9"
plist = { version = "~1.10.3", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "aes", "nistp"] }
base64 = "0.23"
hkdf = "0.13"
hmac = "0.13"
httparse = "1.10"
p256 = { version = "0.14", default-features = false, features = ["pem"] }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "socks-proxy"] }
uuid = "1"
# Share the current RustCrypto generation with HPKE and AEA verification.
rustls-rustcrypto = "=0.1.0-pre.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland"] }
# Dialogs use the desktop portal without exporting a parent Wayland window.
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }

rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libproxy = "0.1.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libgssapi = "0.11"
rustix = { version = "1", features = ["event", "net"] }

[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["platform-verifier"] }
rustls-platform-verifier = { version = "0.7", default-features = false }

# Other targets use the bundled roots instead of the host certificate store.
[target.'cfg(not(any(windows, target_os = "linux", target_os = "macos")))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls-webpki-roots"] }
webpki-roots = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
uuid = { version = "1", features = ["v4"] }
cab = "0.6"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_Usb", "Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "getrandom", "pkcs8"] }
rcgen = { version = "0.14", default-features = false }
time = "0.3"

[build-dependencies]
winresource = { version = "0.1", optional = true, default-features = false }

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
redundant_clone = "warn"
